# Local development profile: no Firebase credentials required.
# The backend accepts `Authorization: Bearer ${fitsense.auth.dev-token}`.
fitsense.auth.mode=${FITSENSE_AUTH_MODE:dev}
fitsense.auth.dev-token=${FITSENSE_DEV_TOKEN:dev-token}

logging.level.com.example.fitsense=DEBUG
logging.level.org.hibernate.SQL=DEBUG
