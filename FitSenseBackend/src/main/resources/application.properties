spring.application.name=FitSenseBackend

# Default to the local "dev" profile (fake token, no Firebase credentials needed).
# Docker/production must override with SPRING_PROFILES_ACTIVE and FITSENSE_AUTH_MODE=firebase.
spring.profiles.default=dev

# Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitsense_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Authentication mode: firebase (verify ID tokens) or dev (accept FITSENSE_DEV_TOKEN).
# Blank means "dev" while the dev profile is active, otherwise "firebase".
fitsense.auth.mode=${FITSENSE_AUTH_MODE:firebase}
fitsense.auth.dev-token=${FITSENSE_DEV_TOKEN:dev-token}

# Servlet / Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS (comma-separated origins; blank allows any origin for local development)
fitsense.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Server Port
server.port=${SERVER_PORT:8080}

# Firebase Configuration
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.project-id=${FIREBASE_PROJECT_ID:}

# Springdoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

# Actuator Management Endpoints
management.endpoints.web.exposure.include=health,info
