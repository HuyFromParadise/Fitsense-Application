services:

  mysql:
    image: mysql:8.4
    container_name: fitsense-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: fitsense_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DB_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./fitsense-backend

    container_name: fitsense-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_URL: jdbc:mysql://mysql:3306/fitsense_db?serverTimezone=UTC
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json

    ports:
      - "8080:8080"

    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: